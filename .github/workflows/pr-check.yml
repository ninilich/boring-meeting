name: PR Checks

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-unit-tests:
    name: Build and Unit Tests
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Detect relevant changes
        id: changes
        shell: bash
        run: |
          set -euo pipefail

          # HEAD is the PR merge commit; its first parent is the current base branch tip.
          # Docs-only changes skip the build, but the job still succeeds so the required check reports.
          if [[ "${{ github.event_name }}" != "pull_request" ]]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          CHANGED="$(git diff --name-only HEAD^1 HEAD)"
          if printf '%s\n' "$CHANGED" | grep -vE '^(docs/|.*\.md$|LICENSE$|\.gitignore$)' | grep -q .; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "Only docs files changed, skipping build and tests."
            echo "build=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Cache Swift packages
        if: steps.changes.outputs.build == 'true'
        uses: actions/cache@v4
        with:
          path: build/SourcePackages
          key: spm-${{ runner.os }}-${{ hashFiles('BoringMeeting.xcodeproj/project.pbxproj', '**/Package.resolved') }}
          restore-keys: |
            spm-${{ runner.os }}-

      - name: Build and run unit tests
        if: steps.changes.outputs.build == 'true'
        run: |
          set -euo pipefail
          xcodebuild \
            -project BoringMeeting.xcodeproj \
            -scheme BoringMeeting \
            -destination 'platform=macOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY= \
            -only-testing:BoringMeetingTests \
            test

  version-gate:
    name: MARKETING_VERSION Gate
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Ensure MARKETING_VERSION increased and What's New entry exists
        shell: bash
        run: |
          set -euo pipefail

          PROJECT_FILE="BoringMeeting.xcodeproj/project.pbxproj"
          WHATS_NEW="BoringMeeting/Resources/WhatsNew.json"

          # HEAD is the PR merge commit; its first parent is the current base branch tip.
          BASE_REF="HEAD^1"

          # Only changes to the shipped app need a new version (tests, scripts, docs and CI don't).
          CHANGED="$(git diff --name-only "$BASE_REF" HEAD)"
          if ! printf '%s\n' "$CHANGED" | grep -qE '^(BoringMeeting/|BMeetingCLI/|BoringMeeting\.xcodeproj/)'; then
            echo "App code unchanged, version bump not required."
            exit 0
          fi

          HEAD_VERSION="$(./scripts/get_marketing_version.sh "$PROJECT_FILE")"

          if git cat-file -e "$BASE_REF:$PROJECT_FILE" 2>/dev/null; then
            git show "$BASE_REF:$PROJECT_FILE" > "$RUNNER_TEMP/base.pbxproj"
            BASE_VERSION="$(./scripts/get_marketing_version.sh "$RUNNER_TEMP/base.pbxproj")"
          else
            BASE_VERSION="0.0.0"
            echo "Bootstrap base detected: $PROJECT_FILE is missing in base branch, using base version $BASE_VERSION"
          fi

          semver='^[0-9]+\.[0-9]+\.[0-9]+$'
          if [[ ! "$HEAD_VERSION" =~ $semver ]]; then
            echo "HEAD MARKETING_VERSION '$HEAD_VERSION' is not semver X.Y.Z" >&2
            exit 1
          fi
          if [[ ! "$BASE_VERSION" =~ $semver ]]; then
            echo "BASE MARKETING_VERSION '$BASE_VERSION' is not semver X.Y.Z" >&2
            exit 1
          fi

          if [[ "$HEAD_VERSION" == "$BASE_VERSION" ]]; then
            echo "MARKETING_VERSION must be increased for merge to main. Current: $HEAD_VERSION" >&2
            exit 1
          fi

          MAX_VERSION="$(printf '%s\n%s\n' "$BASE_VERSION" "$HEAD_VERSION" | sort -V | tail -n1)"
          if [[ "$MAX_VERSION" != "$HEAD_VERSION" ]]; then
            echo "MARKETING_VERSION must be greater than base. base=$BASE_VERSION head=$HEAD_VERSION" >&2
            exit 1
          fi

          if ! jq -e --arg v "$HEAD_VERSION" '.versions[] | select(.version == $v)' "$WHATS_NEW" > /dev/null; then
            echo "No entry for version $HEAD_VERSION in $WHATS_NEW (used as release notes)." >&2
            exit 1
          fi

          echo "Version gate passed: base=$BASE_VERSION -> head=$HEAD_VERSION"

  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
